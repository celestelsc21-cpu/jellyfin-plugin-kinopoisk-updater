name: "Kinopoisk Updater"
guid: "b6967ba0-3cfc-49a7-b570-8ab9ee8d50ce"
version: "0.1.0.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Kinopoisk metadata source for movies, series, seasons and episodes"
description: >
  Adds Kinopoisk as a metadata and image source. Use the standard
  "Refresh metadata" (replace all) on a movie, series, season or episode to
  update titles, overview, taglines, dates, ratings, genres, countries, people
  and poster from Kinopoisk; "Identify" searches Kinopoisk by title or id.
category: "Metadata"
owner: "celesta"
artifacts:
  - "Jellyfin.Plugin.KinopoiskUpdater.dll"
changelog: |
  0.1.0.0 - Plugin skeleton: configuration page (Kinopoisk API key, actor limit),
  CI build and plugin repository manifest.
